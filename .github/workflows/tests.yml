# Prüft bei jeder Änderung Konfiguration und Code (ohne Netzwerkzugriff auf Shops).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m monitor validate
      - run: python -m unittest discover -s tests -t . -v
