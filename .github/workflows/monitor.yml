# Läuft alle 10 Minuten (GitHub kann Cron-Läufe um einige Minuten verzögern).
# Der Zustand liegt auf dem Branch "state" (eine Datei, wird jedes Mal ersetzt),
# damit main sauber bleibt.
name: monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Nur diese Quelle (id aus sources.yaml), leer = alle"
        required: false
        default: ""

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Zustand vom Branch "state" laden
        run: |
          mkdir -p state
          set +e
          git ls-remote --exit-code --heads origin state >/dev/null
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then
            git fetch --depth=1 origin state
            git show FETCH_HEAD:state.json > state/state.json
          elif [ "$rc" = "2" ]; then
            echo "Kein Branch 'state' – erster Lauf, neue Baseline."
            echo '{}' > state/state.json
          else
            echo "::error::GitHub nicht erreichbar (rc=$rc) – Lauf abgebrochen, Zustand bleibt erhalten."
            exit 1
          fi
          # Kaputte Datei? Dann lieber abbrechen als den Zustand zu überschreiben.
          python -c "import json; json.load(open('state/state.json'))"

      - name: Monitor ausführen
        id: run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          CONTACT: ${{ secrets.CONTACT }}
          SOURCE: ${{ inputs.source }}
        run: |
          if [ -n "$SOURCE" ]; then
            python -m monitor run --state state/state.json --source "$SOURCE"
          else
            python -m monitor run --state state/state.json
          fi

      - name: Übersicht
        if: always()
        continue-on-error: true
        run: python -m monitor report --state state/state.json

      - name: Zustand auf Branch "state" speichern
        if: success() || steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s state/state.json ] || exit 0
          python -c "import json; json.load(open('state/state.json'))" || { echo "::error::state.json ungültig – nicht gespeichert"; exit 1; }
          tmp="$(mktemp -d)"
          cp state/state.json "$tmp/state.json"
          cd "$tmp"
          git init -q
          git checkout -q -b state
          git config user.name "tcg-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -q -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state
